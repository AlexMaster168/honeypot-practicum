# srv-web01 - public-facing web box, weak root password (brute-force entry point).
# Only overrides; everything else comes from cowrie.cfg.dist bundled in the image.
# Debian 12 identity matches the bundled fs.pickle, so `cat /etc/os-release` agrees with the banner.

[honeypot]
hostname = srv-web01
timezone = UTC

[shell]
filesystem = /seeds/web01.pickle
kernel_version = 6.1.0-28-amd64
kernel_build_string = #1 SMP PREEMPT_DYNAMIC Debian 6.1.119-1 (2024-11-22)
ssh_version = OpenSSH_9.2p1 Debian-2+deb12u3, OpenSSL 3.0.15 3 Sep 2024

[ssh]
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3
listen_endpoints = tcp:2222:interface=0.0.0.0

# Off: `nmap -sV` fingerprints Cowrie's telnetd as "Cowrie Honeypot telnetd",
# and a Debian web box with telnet would look odd anyway.
[telnet]
enabled = false
