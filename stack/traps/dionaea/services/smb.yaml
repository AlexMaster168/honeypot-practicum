# ASCII only: a single non-ASCII char in a service yaml segfaults dionaea.
# fs01 - the company file server (Windows Server look, Windows 7 SMB stack under the hood).
- name: smb
  config:
    os_type: 4
    primary_domain: CORP
    oem_domain_name: CORP
    server_name: FS01
    native_os: Windows Server 2008 R2 Standard 7601 Service Pack 1
    native_lan_manager: Windows Server 2008 R2 Standard 6.1
    shares:
      ADMIN$:
        comment: Remote Admin
        path: C:\Windows
        type: disktree
      C$:
        comment: Default Share
        path: C:\
        type:
          - disktree
          - special
      IPC$:
        comment: Remote IPC
        type: ipc
      Finance:
        comment: Finance dept
        path: D:\Shares\Finance
        type: disktree
      Backups:
        comment: DB backups
        path: D:\Backups
        type: disktree
